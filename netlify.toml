# Netlify — Site-Root ist landing/. Base-Directory in Netlify LEER lassen.
# /            Ankunftsseite (indexierbar)
# /b/<slug>    Stellenteil (noindex), Daten via Edge Function bw-page
[build]
  publish = "landing"

[[redirects]]
  from = "/b/*"
  to = "/b.html"
  status = 200

# Ankunftsseite: nur eigene Assets + bw-open.
[[headers]]
  for = "/"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; img-src 'self'; style-src 'self'; font-src 'self'; script-src 'self'; connect-src https://hhxwojewbtegovzdxpfw.supabase.co; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"

# Stellenteil: zusätzlich Famulor-Widget. style-src 'unsafe-inline' braucht das Widget (Inline-Styles).
[[headers]]
  for = "/b/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; img-src 'self' data: https://app.famulor.io; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self' https://app.famulor.io; connect-src https://hhxwojewbtegovzdxpfw.supabase.co https://app.famulor.io wss://app.famulor.io; frame-src https://app.famulor.io; media-src 'self' blob: https://app.famulor.io; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
    X-Robots-Tag = "noindex, nofollow"
    Referrer-Policy = "no-referrer"
    Cache-Control = "no-store"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
